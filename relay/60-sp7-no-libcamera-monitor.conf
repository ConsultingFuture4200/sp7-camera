# Surface Pro 7: turn off WirePlumber's libcamera monitor.
#
# On this system it finds the IPU4P cameras but never creates PipeWire devices
# for them (PipeWire 1.6.8's libcamera plugin logs "camera added" and nothing
# reaches WirePlumber). Meanwhile its libcamera CameraManager keeps /dev/media0,
# the capture node and the sensor subdevs open permanently, so the IPU4 isys
# power island can never runtime-suspend. The driver only clears its
# reset_needed flag across that power transition, so after one failed stream
# every later stream start fails too (FIFO overflow, 30 sensor bounces).
#
# Apps get the rear camera through sp7-camera-relay -> v4l2loopback (/dev/video60)
# -> WirePlumber's V4L2 monitor instead. Delete this file to re-enable.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
