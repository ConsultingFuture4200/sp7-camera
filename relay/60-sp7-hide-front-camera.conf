# Surface Pro 7: hide the FRONT camera (ov5693, ACPI ...I2C2.CAMF) from apps
# until its D-PHY link is reliable. A front stream that fails to lock can wedge
# the whole IPU4 isys power island (open() then returns EIO on every node) and
# takes the rear camera down with it until reboot. With this rule apps like
# Chrome only see the rear camera.
#
# WirePlumber logs "libcamera device <name> disabled" when this matches.
# Delete this file (and restart wireplumber) to expose the front camera again.
monitor.libcamera.rules = [
  {
    matches = [
      { device.name = "~.*CAMF.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
