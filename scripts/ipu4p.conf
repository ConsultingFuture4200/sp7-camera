# Intel IPU4P camera stack (Surface Pro 7) — see ~/Projects/sp7-camera/NOTES.md
#
# The blob at /usr/lib/firmware/ipu4p_cpd.bin has fw_pkg_date 0x20191030 in its
# moduledata header, while the driver's built-in library version is 20181222.
# The resulting "Moduledata and library version mismatch (20191030 != 20181222)"
# is structural to this firmware, not a bad download, so the check must be off.
options intel_ipu4p fw_version_check=0

# CSI-2 lane settle counts. The driver's auto-calculated values are the
# computed MINIMUM (dsettle=661 csettle=684 @419.2MHz); on this unit the front
# ov5693 fails D-PHY sync 100% of the time at those values ("DPHY
# non-recoverable synchronization error" on every stream start). Mid-window
# values fix it -- verified 2026-09-12, 3 frames of 2592x1944 RAW10.
# Windows per the port author: dsettle 661..1103, csettle 684..2247.
# 880 is also inside the rear ov8865 window (658..1093 @360MHz), and the
# override is global, so this value has to serve both sensors.
options intel_ipu4p_isys csi2_dsettle=880 csi2_csettle=1400


# Do not autoload. Two reasons:
#  1. udev runs ~50 v4l_id probes when isys registers its video nodes; each one
#     re-authenticates the firmware and bounces the psys power island. One timed
#     out buttress handshake latches mmu1 into runtime-PM "error" permanently.
#  2. The CSE handshake needs time to settle after boot; loading too early gives
#     "Expect magic number timeout" / "CSE boot_load failed".
# Load manually (or via the systemd timer in step 14) in the documented order.
blacklist intel_ipu4p
blacklist intel_ipu4p_isys
blacklist intel_ipu4p_psys
blacklist intel_ipu4p_isys_csslib
blacklist intel_ipu4p_psys_csslib
blacklist ipu_bridge
